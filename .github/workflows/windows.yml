name: Windows Test

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2025

    steps:
      - name: System information
        shell: powershell
        run: |
          Write-Host "Windows:"
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsArchitecture

          Write-Host "CPU:"
          Get-CimInstance Win32_Processor | Select-Object Name, NumberOfLogicalProcessors

          Write-Host "RAM:"
          Get-CimInstance Win32_ComputerSystem |
            Select-Object @{Name="RAM_GB";Expression={[math]::Round($_.TotalPhysicalMemory / 1GB,2)}}

      - name: Keep job running for testing
        shell: powershell
        run: |
          Write-Host "Runner is ready."
          Start-Sleep -Seconds 300
